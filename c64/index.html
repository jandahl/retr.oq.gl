<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>retr-oq — C64 desktop prototype</title>
<!-- ?v= cache-busting, same convention as dos/index.html and mac1984/index.html
     -- bump the number for style.css/app.js whenever either actually changes. -->
<link rel="stylesheet" href="style.css?v=24" />
</head>
<body>
  <!-- No separate boot screen: the real C64 has no startup delay or splash
       to gate past -- power-on lands directly on the BASIC V2 ready screen,
       which is exactly what #c64-dir below already shows. Adding a
       click-through screen in front of it would just duplicate that text
       for no reason true to the hardware. -->
  <!-- The C64 booted straight into BASIC, no desktop, no icons -- same
       single-tasking reasoning dos/'s #dos-dir comment gives, just a
       different real screen: this is what LOAD"$",8 + LIST actually
       printed, not a DOS `dir`. 40 columns, not DOS's 80 -- the real C64
       screen width, which is why the layout/column choices below differ
       from dos/'s at every turn. -->
  <div class="c64-screen" id="c64-dir">
    <div id="c64-output">    **** COMMODORE 64 BASIC V2 ****

 64K RAM SYSTEM  38911 BASIC BYTES FREE

READY.
LOAD"$",8
SEARCHING FOR $
LOADING
READY.
LIST

0 "OQ DISK       " 09 2A
<button type="button" class="c64-link" data-load="DICT">1   "DICT"              PRG</button>
<button type="button" class="c64-link" data-load="DECON">1   "DECON"             PRG</button>
<button type="button" class="c64-link" data-load="MORPH">1   "MORPH"             PRG</button>
<button type="button" class="c64-link" data-load="KALQ">1   "KALQ"              PRG</button>
<span class="c64-dim">1   "DICT DAT"          SEQ</span>
<span class="c64-dim">1   "BUILD"             PRG</span>
<button type="button" class="c64-link" data-action="quit">2   "QUIT"              PRG</button>
661 BLOCKS FREE.
</div>
    <!-- A real command line, same role as dos/'s #dos-cmd -- LOAD"NAME",8,1
         then RUN is the actual two-step C64 idiom (see app.js's runCommand),
         not a single launch command the way DOS's DICT was. -->
    <div class="c64-prompt-line">READY.
      <div class="c64-cmd-entry"><input type="text" id="c64-cmd" class="c64-cmd-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" /><span class="c64-block-caret" aria-hidden="true"></span></div>
    </div>
  </div>

  <!-- DICT.PRG: a full-screen takeover, not a floating window -- same
       single-tasking reasoning as #c64-dir above. Esc / the exit line
       returns to the dir listing. -->
  <div class="c64-app" id="dict-app" hidden>
    <div class="c64-app-header">DICT</div>
    <div class="c64-app-toolbar">
      <input type="text" id="dict-filter" class="c64-input" placeholder="FILTER..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <p class="c64-app-status" id="dict-status"></p>
    </div>
    <div class="c64-app-results">
      <table id="dict-table">
        <thead>
          <tr><th>LEXEME</th><th>TRANSLATION</th></tr>
        </thead>
        <tbody id="dict-tbody"></tbody>
      </table>
      <!-- Filled in by app.js from shared/dict-source.js's DICT_ATTRIBUTION,
           same reasoning as dos/index.html's identical block -- but as a
           link here, not bare text: CC-BY-SA 4.0 requires this exact string
           wherever the data is shown (dict-source.js's own comment), so the
           text itself can't shrink or hide, only stop being dead weight by
           linking out to the actual license. Lives at the bottom of the
           results list, scrolling with it, rather than in a fixed footer
           that permanently eats screen space above RUN/STOP=EXIT -- a
           short current result set (DEFAULT_ROWS/MAX_FILTERED_ROWS in
           app.js) means it's usually one scroll away, not buried. -->
      <p class="c64-app-attribution">
        <a id="dict-attribution" href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer"></a>
      </p>
    </div>
    <button type="button" class="c64-app-footer" id="dict-exit">RUN/STOP=EXIT TO READY.</button>
  </div>


  <!-- DECON.PRG: full-screen takeover like #dict-app — inverse of DICT
       (surface word → morpheme breakdown). Period 16-char disk naming keeps
       the program label DECON (not "Word Deconstructor"). Wired through
       shared/decon-app.js + OqRouter (?screen=decon). -->
  <div class="c64-app" id="decon-app" hidden>
    <div class="c64-app-header">DECON</div>
    <div class="c64-app-toolbar">
      <input type="text" id="decon-word" class="c64-input" placeholder="WORD..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <label class="decon-order-toggle">
        <input type="checkbox" id="decon-root-first" checked />
        <span class="decon-checkbox-glyph" aria-hidden="true"></span> ROOT FIRST
      </label>
      <p class="c64-app-status" id="decon-status"></p>
    </div>
    <div class="c64-app-results" id="decon-results"></div>
    <button type="button" class="c64-app-footer" id="decon-exit">RUN/STOP=EXIT TO READY.</button>
  </div>

  <!-- MORPH.PRG: same full-screen-takeover idiom as #dict-app above -- text
       mode has no room for gb/'s sprite or D-pad, so this is the same
       shared/morph-game.js state machine rendered as a numbered BASIC-style
       option list instead: press 1-9 (or arrow keys + RETURN) to answer. -->
  <div class="c64-app" id="morph-app" hidden>
    <div class="c64-app-header">MORPH<span id="morph-hud" class="c64-morph-hud"></span></div>
    <div class="c64-app-toolbar">
      <p id="morph-word" class="c64-morph-word"></p>
      <p class="c64-app-status" id="morph-status"></p>
      <div class="c64-morph-timerbar"><div id="morph-timerfill" class="c64-morph-timerfill"></div></div>
    </div>
    <div class="c64-app-results">
      <ol id="morph-options" class="c64-morph-options"></ol>
    </div>
    <button type="button" class="c64-app-footer" id="morph-exit">RUN/STOP=EXIT TO READY.</button>
  </div>

  <!-- KALQ.PRG: same full-screen-takeover idiom as #dict-app/#morph-app --
       shared/klax-game.js (the same engine snes/'s KAL-Q uses) rendered as
       a real bitmapped playfield on a canvas, drawn only in the theme's
       own 16-color VIC-II palette (see app.js). -->
  <div class="c64-app" id="kalq-app" hidden>
    <div class="c64-app-header">KALQ</div>
    <div class="c64-app-results c64-kalq-results">
      <canvas id="kalq-canvas" class="c64-kalq-canvas" width="320" height="200"></canvas>
      <!-- On-screen joystick+fire idiom (a real C64 played this with a
           joystick, not a keyboard) -- mobile has no arrow keys, and
           unlike DICT's text field or MORPH's clickable option list,
           KALQ has no other pointer-friendly way to move/place/discard.
           Always shown, not just on touch -- same convention nes/gb/gg/
           snes's own on-screen pads follow (a mouse can click it too). -->
      <div class="c64-kalq-pad" id="kalq-pad">
        <button type="button" class="c64-kalq-btn" data-input="left" aria-label="Left">&#9664;</button>
        <button type="button" class="c64-kalq-btn c64-kalq-btn-small" data-input="up" aria-label="Fast">&#9650;</button>
        <button type="button" class="c64-kalq-btn c64-kalq-btn-primary" data-input="a" aria-label="Place">PLACE</button>
        <button type="button" class="c64-kalq-btn c64-kalq-btn-small" data-input="down" aria-label="Discard">&#9660;</button>
        <button type="button" class="c64-kalq-btn" data-input="right" aria-label="Right">&#9654;</button>
      </div>
    </div>
    <button type="button" class="c64-app-footer" id="kalq-exit">RUN/STOP=EXIT TO READY.</button>
  </div>

  <!-- The RUN loading-screen flicker (issue #27 piece 2): a transient
       full-screen takeover of its own, not folded into #c64-dir, since a
       real LOAD/RUN blanked the screen to a solid border-cycling color
       while it worked -- there was no listing visible underneath. -->
  <div class="c64-loading" id="c64-loading" hidden aria-hidden="true"></div>

<script src="../shared/dict-source.js?v=3"></script>
<script src="../shared/katersat-source.js?v=1"></script>
<script src="../shared/dict-merge.js?v=1"></script>
<script src="../shared/hyphenation.js?v=1"></script>
<script src="../shared/router.js?v=6"></script>
<script type="module" src="../shared/oq-analysis.js?v=13"></script>
<script src="../shared/decon-app.js?v=1"></script>
<script src="../shared/morph-puzzles.js?v=4"></script>
<script src="../shared/morph-game.js?v=2"></script>
<script src="../shared/klax-game.js?v=10"></script>
<script src="app.js?v=24"></script>
</body>
</html>

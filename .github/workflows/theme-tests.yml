name: theme tests

# One workflow, not five copy-pasted ones -- gb-tests.yml, gg-tests.yml,
# nes-tests.yml, snes-tests.yml, and win98-tests.yml were identical apart
# from which theme/paths/test file they named, which is exactly the kind
# of drift CLAUDE.md warns about for cache-bust versions ("stale JS next to
# fresh HTML is a real shipped bug") -- the same risk applies to stale
# workflow copies: win98-tests.yml had drifted to `pytest tests/ -v` (the
# WHOLE suite) instead of just tests/test_win98.py, silently masked because
# it still passed. Add a new console/desktop theme's own test suite here by
# adding its own block to the `filters:` section below (its name becomes
# both a selected suite and the pytest file it runs, tests/test_<name>.py)
# -- no new workflow file, no new job to copy.
#
# The `changes` job computes which themes' paths actually changed so an
# unrelated PR (say, kde/ or docs) doesn't spin up browser tests for
# nothing; the `test` job then runs only the suites that changed.
# Shared top-level scripts and workflow edits exercise every suite so common
# dependency changes and CI changes cannot silently skip browser coverage.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "aqua/**"
      - "c64/**"
      - "compy/**"
      - "gb/**"
      - "gg/**"
      - "nes/**"
      - "snes/**"
      - "win98/**"
      - "os2/**"
      - "win31/**"
      - "dos/**"
      - "xp/**"
      - "win7/**"
      - "kde/**"
      - "shared/**"
      - "vendor/**"
      - "tests/**"
      - ".github/workflows/theme-tests.yml"
  workflow_dispatch:

concurrency:
  group: theme-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # `changes` (not per-filter outputs.<name>) is dorny/paths-filter's own
    # "which filters matched" JSON array -- e.g. '["gb","win98"]' -- built
    # for exactly this: selecting just the changed
    # themes. The alternative (a fixed 5-item matrix gated by a job-level
    # `if: needs.changes.outputs[matrix.theme] == 'true'`) looks reasonable
    # but is invalid: `matrix` isn't in the context GitHub allows inside
    # `jobs.<job_id>.if` (only `strategy`/`runs-on`/`steps` can see it) --
    # that mistake made the very first version of this file fail to parse
    # at all (zero jobs scheduled, no code ever ran).
    outputs:
      themes: ${{ steps.filter.outputs.changes }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            aqua:
              - "aqua/**"
              - "shared/osx/**"
              - "vendor/**"
              - "tests/test_aqua.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
              - "shared/*.js"
              - ".github/workflows/theme-tests.yml"
            c64:
              - "c64/**"
              - "vendor/c64/**"
              - "tests/test_c64.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
              - "shared/*.js"
              - ".github/workflows/theme-tests.yml"
            gb:
              - "gb/**"
              - "vendor/nes/fonts/**"
              - "shared/morph-game.js"
              - "shared/morph-puzzles.js"
              - "tests/test_gb.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
              - "shared/*.js"
              - ".github/workflows/theme-tests.yml"
            gg:
              - "gg/**"
              - "vendor/nes/fonts/**"
              - "tests/test_gg.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
              - "shared/*.js"
              - ".github/workflows/theme-tests.yml"
            nes:
              - "nes/**"
              - "vendor/nes/**"
              - "tests/test_nes.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
              - "shared/*.js"
              - ".github/workflows/theme-tests.yml"
            snes:
              - "snes/**"
              - "vendor/nes/fonts/**"
              - "vendor/next/fonts/**"
              - "shared/klax-game.js"
              - "tests/test_snes.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
              - "shared/*.js"
              - ".github/workflows/theme-tests.yml"
            win98:
              - "win98/**"
              - "vendor/win98/**"
              - "shared/redmond/**"
              - "shared/router.js"
              - "tests/test_win98.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
              - "shared/*.js"
              - ".github/workflows/theme-tests.yml"
            redmond_run:
              - "shared/redmond/**"
              - "shared/router.js"
              - "win98/**"
              - "xp/**"
              - "win7/**"
              - "tests/test_redmond_run.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
              - "shared/*.js"
              - ".github/workflows/theme-tests.yml"
            screensavers:
              - "vendor/screensavers/**"
              - "shared/redmond/**"
              - "shared/router.js"
              - "xp/**"
              - "win98/**"
              - "win7/**"
              - "win31/**"
              - "kde/**"
              - "tests/test_screensavers.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
              - "shared/*.js"
              - ".github/workflows/theme-tests.yml"
            os2:
              - "os2/**"
              - "win31/**"
              - "dos/**"
              - "shared/**"
              - "tests/test_os2.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
              - "shared/*.js"
              - ".github/workflows/theme-tests.yml"
            shared:
              - "shared/**/*.js"
              - "tests/shared/**"
              - ".github/workflows/theme-tests.yml"

  shared-node-tests:
    # shared/morph-puzzles.js, shared/morph-game.js and shared/klax-game.js
    # (the MORPH!/KLAX minigame engine + data, loaded classic-script-style
    # by gb/, snes/, and c64/)
    # are pure logic with no DOM, so they get their own fast Node-only job
    # instead of waiting on the `changes`/Playwright matrix above. Runs on
    # only when shared JS or shared Node tests changed; this avoids a runner
    # for unrelated theme-only changes while preserving the direct coverage.
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/shared/*.mjs

  test:
    needs: changes
    if: needs.changes.outputs.themes != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install --require-hashes -r tests/requirements.txt

      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.62.0

      # The hosted Ubuntu runner already has Chromium's system libraries.
      # Avoid --with-deps here: it runs apt-get against third-party runner
      # repositories and can fail before Playwright downloads the browser.
      - name: Install Playwright's Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: playwright install chromium

      - name: Run changed theme test suites
        run: |
          test_files=()
          for theme in ${{ join(fromJSON(needs.changes.outputs.themes), ' ') }}; do
            test_files+=("tests/test_${theme}.py")
          done
          python3 -m pytest "${test_files[@]}" -v

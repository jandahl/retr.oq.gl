name: html lint

# Runs on every push/PR (unlike the per-theme Playwright suites, this has
# no browser/JS behavior to exercise -- just markup validity and broken
# local links) against the pages that currently pass html-validate:recommended
# cleanly under the repo's root .htmlvalidate.json. Most other theme pages
# do NOT pass yet -- a spot check found real pre-existing issues (icon-only
# buttons with no accessible text, aria-label used on the wrong element,
# hand-rolled widgets html-validate wants as native <button>/<select>) that
# are each their own themed-fix PR, not something to silently mass-edit
# from a CI-tooling change. Add a theme to PAGES below once its own
# index.html passes `npx html-validate <theme>/index.html` with zero errors.
#
# Supersedes the old mac1984-ci.yml (manual-dispatch-only, mac1984 alone) --
# same html-validate + linkinator recipe, generalized to a fixed page list
# and running automatically instead of by hand.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "hub-data.js"
      - ".htmlvalidate.json"
      - "package-lock.json"
      - "requirements-dev.txt"
      - "tools/check_css.py"
      - "tools/check_palette.py"
      - "tools/palette-baseline.json"
      - ".github/workflows/html-lint.yml"
  workflow_dispatch:

concurrency:
  group: html-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PAGES: "index.html dos/index.html c64/index.html mac1984/index.html win31/index.html os2/index.html"

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked npm tooling
        run: npm ci --ignore-scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install CSS lint dependencies
        run: "pip install --only-binary=:all: --require-hashes -r requirements-dev.txt"

      - name: CSS syntax validate
        run: git ls-files -z -- '*.css' ':(exclude)vendor/**' | xargs -0 python3 tools/check_css.py

      - name: JavaScript syntax validate
        run: git ls-files -z -- '*.js' ':(exclude)vendor/**' | xargs -0 -n1 node --check

      - name: HTML validate
        # Pin the CLI: resolving latest made the check depend on a moving
        # registry target and recently selected an unavailable tarball.
        run: npx --no-install html-validate $PAGES

      # --skip excludes anything not on localhost: this step is scoped to
      # LOCAL asset links (a stale ?v= path, a moved shared/*.js) same as
      # its name says. An external link's liveness is not this repo's to
      # police -- index.html's github.com/jandahl/oq link 404s to an
      # anonymous request (the repo is private) despite being a perfectly
      # correct link for anyone with access, which is exactly the kind of
      # false positive that would make people stop trusting this check.
      - name: Check for broken local asset links
        run: |
          python3 -m http.server 8080 &
          server_pid=$!
          npx --no-install wait-on http://localhost:8080/index.html
          for page in $PAGES; do
            npx --no-install linkinator "http://localhost:8080/$page" --recurse false --skip "^https?://(?!localhost)"
          done
          kill "$server_pid"

      # Generalized over however many entries hub-data.js has -- no fixed
      # theme list to keep in sync. hub.js renders index.html's tiles from
      # that data at runtime (see index.html's empty <ul class="timeline">),
      # so this reads hub-data.js's `href` fields directly rather than
      # scraping rendered markup. Requires each to resolve to a real
      # theme/ dir with its own index.html, and to be a directory
      # reference (bare "name/"), not an explicit "name/index.html" --
      # the thing this PR removed.
      - name: Check hub tile links resolve to theme directories
        run: |
          python3 - <<'EOF'
          import re, sys, os

          js = open("hub-data.js", encoding="utf-8").read()
          hrefs = re.findall(r'href:\s*"([^"]+)"', js)
          if not hrefs:
              sys.exit("no hub entries found in hub-data.js -- regex out of sync with the data shape?")

          failed = False
          for href in hrefs:
              if href.endswith("index.html"):
                  print(f"FAIL {href}: explicit index.html in hub link (use the bare directory)")
                  failed = True
                  continue
              if not href.endswith("/"):
                  print(f"FAIL {href}: hub tile href should be a directory (trailing slash)")
                  failed = True
                  continue
              target = os.path.join(href, "index.html")
              if not os.path.isfile(target):
                  print(f"FAIL {href}: no {target} on disk")
                  failed = True

          if failed:
              sys.exit(1)
          print(f"OK: {len(hrefs)} hub tile links checked")
          EOF

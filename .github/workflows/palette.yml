name: palette

# Palette validation is intentionally not a PR check. Run it locally (or use
# manual dispatch for an explicit full verification).
on:
  workflow_dispatch:

concurrency:
  group: palette-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  palette:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_palette.py

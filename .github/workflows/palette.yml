name: palette

# Pull requests run this check from html-lint.yml (it already triggers on
# tools/check_palette.py and tools/palette-baseline.json). This workflow
# is the manual full run.
on:
  workflow_dispatch:

concurrency:
  group: palette-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  palette:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_palette.py

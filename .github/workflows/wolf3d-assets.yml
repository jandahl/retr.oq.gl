name: wolf3d assets

# Manual-only test suite for Wolfenstein 3D asset integrity.
# Not triggered on push or pull_request to avoid running automatically.
on:
  workflow_dispatch:

concurrency:
  group: wolf3d-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-wolf3d-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Wolf3D replacement wall textures and shading
        run: python3 tests/test_wolf3d.py

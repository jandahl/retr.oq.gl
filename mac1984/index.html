<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>retr-oq — System 1 (Cupertino)</title>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  if (!params.get("era")) params.set("era", "system1");
  try {
    localStorage.setItem("retr-oq:cupertino-era", params.get("era"));
    localStorage.setItem("retr-oq:aqua-osx-era", params.get("era"));
  } catch (err) {
    /* ignore */
  }
  var q = params.toString();
  var target = "../cupertino/" + (q ? "?" + q : "") + (window.location.hash || "");
  window.location.replace(target);
})();
</script>
</head>
<body>
  <p><a href="../cupertino/?era=system1">Continue to Cupertino (System 1)…</a></p>
</body>
</html>

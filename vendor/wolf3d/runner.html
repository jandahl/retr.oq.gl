<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no">
  <title>Wolfenstein 3D</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      color: #ccc;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #viewport-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #main {
      /* scale to fit viewport while keeping 640x400 aspect ratio */
      position: relative;
      left: auto;
      top: auto;
      margin: 0;
      transform-origin: center center;
    }
  </style>

  <script src="js/modernizr.custom.js"></script>
  <script src="js/jquery-1.7.1.min.js"></script>
  <script src="js/load.js"></script>
</head>
<body>

<div id="viewport-wrapper">
  <div id="main">
    <div id="title-screen"></div>
    
    <div id="menu">
      <div class="message confirm-newgame">
        <div class="box"></div>
      </div>

      <div class="menu main">
        <ul class="selector">
          <li data-submenu="episodes" class="newgame"><div class="button"></div></li>
          <li data-submenu="sound" class="sound"><div class="button"></div></li>
          <li data-submenu="control" class="control"><div class="button"></div></li>
          <li class="readthis"><div class="button"></div></li>
          <li class="resumegame"><div class="button"></div></li>
        </ul>
      </div>
      
      <div class="menu sound" data-backmenu="main">
        <ul class="selector">
          <li class="sfxon"><div class="button"><div class="light"></div></div></li>
          <li class="sfxoff"><div class="button"><div class="light"></div></div></li>
          <li class="musicon"><div class="button"><div class="light"></div></div></li>
          <li class="musicoff"><div class="button"><div class="light"></div></div></li>
        </ul>
      </div>
      
      <div class="menu control" data-backmenu="main">
        <ul class="selector">
          <li class="mouseenabled"><div class="button"><div class="light"></div></div></li>
          <li data-submenu="customize" class="customize"><div class="button"></div></li>
        </ul>
      </div>
      
      <div class="menu customize" data-backmenu="control">
        <ul class="selector">
          <li class="customizekeys line1"><div class="button">
            <span class="k1 run" data-action="run"></span>
            <span class="k2 use" data-action="use"></span>
            <span class="k3 attack" data-action="attack"></span>
            <span class="k4 strafe" data-action="strafe"></span>
          </div></li>
          <li class="customizekeys line1"><div class="button">
            <span class="k1 left" data-action="left"></span>
            <span class="k2 right" data-action="right"></span>
            <span class="k3 up" data-action="up"></span>
            <span class="k4 down" data-action="down"></span>
          </div></li>
        </ul>
      </div>
      
      <div class="menu skill" data-backmenu="episodes">
        <div class="face"></div>
        <ul class="selector">
          <li data-submenu="levels" data-skill="gd_baby" class="baby"><div class="button"></div></li>
          <li data-submenu="levels" data-skill="gd_easy" class="easy"><div class="button"></div></li>
          <li data-submenu="levels" data-skill="gd_medium" class="medium"><div class="button"></div></li>
          <li data-submenu="levels" data-skill="gd_hard" class="hard"><div class="button"></div></li>
        </ul>
      </div>
      
      <div class="menu episodes" data-backmenu="main">
        <ul class="selector">
          <li data-episode="0" class="ep-1"><div class="button"></div></li>
          <li data-episode="1" class="ep-2"><div class="button"></div></li>
          <li data-episode="2" class="ep-3"><div class="button"></div></li>
          <li data-episode="3" class="ep-4"><div class="button"></div></li>
          <li data-episode="4" class="ep-5"><div class="button"></div></li>
          <li data-episode="5" class="ep-6"><div class="button"></div></li>
        </ul>
      </div>
      
      <div class="menu levels">
        <ul class="selector">
          <li data-level="0">Floor 1</li>
          <li data-level="1">Floor 2</li>
          <li data-level="2">Floor 3</li>
          <li data-level="3">Floor 4</li>
          <li data-level="4">Floor 5</li>
          <li data-level="5">Floor 6</li>
          <li data-level="6">Floor 7</li>
          <li data-level="7">Floor 8</li>
          <li data-level="8">Floor 9</li>
          <li data-level="9">Floor 10</li>
        </ul>
      </div>
    </div>
    
    <div id="game">
      <div class="fps"></div>
      <div class="center"></div>
      <div class="text"></div>
      <div class="message pause">
        <div class="box"></div>
      </div>
      
      <div class="damage-flash"></div>
      <div class="bonus-flash"></div>
      
      <div class="victory-screen">
        <div class="layer-1"></div>
        <div class="layer-2"></div>
      </div>
      
      <div class="intermission-screen">
        <div class="background"></div>
        <div class="time stat">
          <div class="digit"></div>
          <div class="digit"></div>
          <div class="colon"></div>
          <div class="digit"></div>
          <div class="digit"></div>
        </div>
        <div class="par stat">
          <div class="digit"></div>
          <div class="digit"></div>
          <div class="colon"></div>
          <div class="digit"></div>
          <div class="digit"></div>
        </div>
        <div class="kill-ratio stat">
          <div class="digit"></div>
          <div class="digit"></div>
          <div class="digit"></div>
        </div>
        <div class="secret-ratio stat">
          <div class="digit"></div>
          <div class="digit"></div>
          <div class="digit"></div>
        </div>
        <div class="treasure-ratio stat">
          <div class="digit"></div>
          <div class="digit"></div>
          <div class="digit"></div>
        </div>
        
        <div class="avg-kill-ratio victory-stat">
          <div class="digit"></div><div class="digit"></div><div class="digit"></div>
        </div>
        <div class="avg-secret-ratio victory-stat">
          <div class="digit"></div><div class="digit"></div><div class="digit"></div>
        </div>
        <div class="avg-treasure-ratio victory-stat">
          <div class="digit"></div><div class="digit"></div><div class="digit"></div>
        </div>
      </div>
      
      <div class="hud">
        <div class="floor number-container">
          <div class="number"></div>
        </div>
        <div class="score number-container">
          <div class="number"></div><div class="number"></div><div class="number"></div><div class="number"></div><div class="number"></div><div class="number"></div>
        </div>
        <div class="lives number-container">
          <div class="number"></div>
        </div>
        <div class="health number-container">
          <div class="number"></div><div class="number"></div><div class="number"></div>
        </div>
        <div class="ammo number-container">
          <div class="number"></div><div class="number"></div>
        </div>
        <div class="key1"></div>
        <div class="key2"></div>
        <div class="bj"></div>
        <div class="weapon"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Resize scaler to maintain 640x400 aspect ratio nicely inside iframe
  function fitMain() {
    const main = document.getElementById("main");
    if (!main) return;
    const w = window.innerWidth;
    const h = window.innerHeight;
    const scale = Math.min(w / 640, h / 400);
    main.style.transform = `scale(${scale})`;
  }
  window.addEventListener("resize", fitMain);
  fitMain();

  let lastActivityTime = 0;
  function notifyActivity() {
    const now = Date.now();
    if (now - lastActivityTime > 5000) {
      lastActivityTime = now;
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "game-activity" }, "*");
        }
      } catch (e) {}
    }
  }
  window.addEventListener("keydown", notifyActivity, true);
  window.addEventListener("pointerdown", notifyActivity, true);
</script>

</body>
</html>

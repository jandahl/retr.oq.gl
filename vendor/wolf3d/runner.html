<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no">
  <title>Wolfenstein 3D</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      color: #ccc;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #viewport-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #main {
      /* scale to fit viewport while keeping 640x400 aspect ratio */
      position: relative !important;
      left: auto !important;
      top: auto !important;
      margin: 0 !important;
      transform-origin: center center;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    /* Virtual Touch Controls */
    #touch-controls {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .touch-btn {
      position: absolute;
      pointer-events: auto;
      background: rgba(40, 40, 40, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.85);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .touch-btn:active, .touch-btn.active {
      background: rgba(220, 40, 40, 0.65);
      border-color: rgba(255, 255, 255, 0.8);
      transform: scale(0.96);
    }
    /* D-pad Cluster (Bottom-Left) */
    .dpad-cluster {
      position: absolute;
      left: 14px;
      bottom: 14px;
      width: 150px;
      height: 150px;
      pointer-events: none;
    }
    .dpad-btn {
      width: 46px;
      height: 46px;
      font-size: 22px;
    }
    .dpad-up {
      top: 0;
      left: 52px;
    }
    .dpad-down {
      bottom: 0;
      left: 52px;
    }
    .dpad-left {
      top: 52px;
      left: 0;
    }
    .dpad-right {
      top: 52px;
      right: 0;
    }
    /* Action Buttons Cluster (Bottom-Right) */
    .action-cluster {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 150px;
      height: 150px;
      pointer-events: none;
    }
    .btn-fire {
      right: 0;
      bottom: 54px;
      width: 62px;
      height: 62px;
      font-size: 15px;
      border-radius: 50%;
      background: rgba(180, 20, 20, 0.5);
      border-color: rgba(255, 100, 100, 0.6);
    }
    .btn-use {
      right: 74px;
      bottom: 14px;
      width: 58px;
      height: 58px;
      font-size: 13px;
      border-radius: 50%;
      background: rgba(20, 120, 200, 0.5);
      border-color: rgba(100, 180, 255, 0.6);
    }
    .btn-strafe {
      right: 14px;
      bottom: 0;
      width: 48px;
      height: 38px;
      font-size: 11px;
    }
    /* Top Bar Control (Pause / Menu) */
    .top-cluster {
      position: absolute;
      top: 10px;
      right: 10px;
      pointer-events: none;
    }
    .btn-menu {
      width: 56px;
      height: 34px;
      font-size: 12px;
      background: rgba(30, 30, 30, 0.5);
    }
  </style>

  <script src="js/modernizr.custom.js"></script>
  <script src="js/jquery-1.7.1.min.js"></script>
  <script src="js/load.js"></script>
</head>
<body>

<div id="viewport-wrapper">
  <div id="main">
    <div id="title-screen"></div>
    
    <div id="menu">
      <div class="message confirm-newgame">
        <div class="box"></div>
      </div>

      <div class="menu main">
        <ul class="selector">
          <li data-submenu="episodes" class="newgame"><div class="button"></div></li>
          <li data-submenu="sound" class="sound"><div class="button"></div></li>
          <li data-submenu="control" class="control"><div class="button"></div></li>
          <li class="readthis"><div class="button"></div></li>
          <li class="resumegame"><div class="button"></div></li>
        </ul>
      </div>
      
      <div class="menu sound" data-backmenu="main">
        <ul class="selector">
          <li class="sfxon"><div class="button"><div class="light"></div></div></li>
          <li class="sfxoff"><div class="button"><div class="light"></div></div></li>
          <li class="musicon"><div class="button"><div class="light"></div></div></li>
          <li class="musicoff"><div class="button"><div class="light"></div></div></li>
        </ul>
      </div>
      
      <div class="menu control" data-backmenu="main">
        <ul class="selector">
          <li class="mouseenabled"><div class="button"><div class="light"></div></div></li>
          <li data-submenu="customize" class="customize"><div class="button"></div></li>
        </ul>
      </div>
      
      <div class="menu customize" data-backmenu="control">
        <ul class="selector">
          <li class="customizekeys line1"><div class="button">
            <span class="k1 run" data-action="run"></span>
            <span class="k2 use" data-action="use"></span>
            <span class="k3 attack" data-action="attack"></span>
            <span class="k4 strafe" data-action="strafe"></span>
          </div></li>
          <li class="customizekeys line1"><div class="button">
            <span class="k1 left" data-action="left"></span>
            <span class="k2 right" data-action="right"></span>
            <span class="k3 up" data-action="up"></span>
            <span class="k4 down" data-action="down"></span>
          </div></li>
        </ul>
      </div>
      
      <div class="menu skill" data-backmenu="episodes">
        <div class="face"></div>
        <ul class="selector">
          <li data-submenu="levels" data-skill="gd_baby" class="baby"><div class="button"></div></li>
          <li data-submenu="levels" data-skill="gd_easy" class="easy"><div class="button"></div></li>
          <li data-submenu="levels" data-skill="gd_medium" class="medium"><div class="button"></div></li>
          <li data-submenu="levels" data-skill="gd_hard" class="hard"><div class="button"></div></li>
        </ul>
      </div>
      
      <div class="menu episodes" data-backmenu="main">
        <ul class="selector">
          <li data-episode="0" class="episode-0"><div class="button"></div></li>
          <li data-episode="1" class="episode-1"><div class="button"></div></li>
          <li data-episode="2" class="episode-2"><div class="button"></div></li>
          <li data-episode="3" class="episode-3"><div class="button"></div></li>
          <li data-episode="4" class="episode-4"><div class="button"></div></li>
          <li data-episode="5" class="episode-5"><div class="button"></div></li>
        </ul>
      </div>
      
      <div class="menu levels">
        <ul class="selector">
          <li data-level="0">Floor 1</li>
          <li data-level="1">Floor 2</li>
          <li data-level="2">Floor 3</li>
          <li data-level="3">Floor 4</li>
          <li data-level="4">Floor 5</li>
          <li data-level="5">Floor 6</li>
          <li data-level="6">Floor 7</li>
          <li data-level="7">Floor 8</li>
          <li data-level="8">Floor 9</li>
          <li data-level="9">Floor 10</li>
        </ul>
      </div>
    </div>
    
    <div id="game">
      <div class="fps"></div>
      
      <div class="renderer">
        <div class="ceiling"></div>
        <div class="floor"></div>
        <div class="player-weapon"></div>
        <div class="damage-flash overlay"></div>
        <div class="bonus-flash overlay"></div>
        <div class="death overlay"></div>
        <div class="pause overlay"><img alt="" src="art/paused.png"/></div>
      </div>
      
      <div class="loading"><img alt="" src="art/getpsyched.png"/></div>
      
      <div class="gameover"></div>
      
      <div class="intermission">
        <div class="background"></div>
        <div class="background-secret"></div>
        <div class="background-victory"></div>
        
        <div class="bj"></div>
        
        <div class="floor stat">
          <div class="digit"></div>
          <div class="digit"></div>
        </div>
        
        <div class="bonus stat">
          <div class="digit"></div>
          <div class="digit"></div>
          <div class="digit"></div>
          <div class="digit"></div>
          <div class="digit"></div>
          <div class="digit"></div>
        </div>
        
        <div class="total-time-minutes victory-stat">
          <div class="digit"></div><div class="digit"></div>
        </div>
        <div class="total-time-seconds victory-stat">
          <div class="digit"></div><div class="digit"></div>
        </div>

        <div class="time-minutes stat">
          <div class="digit"></div>
          <div class="digit"></div>
        </div>
        <div class="time-seconds stat">
          <div class="digit"></div>
          <div class="digit"></div>
        </div>
        <div class="par-minutes stat">
          <div class="digit"></div>
          <div class="digit"></div>
        </div>
        <div class="par-seconds stat">
          <div class="digit"></div>
          <div class="digit"></div>
        </div>

        <div class="kill-ratio stat">
          <div class="digit"></div>
          <div class="digit"></div>
          <div class="digit"></div>
        </div>
        <div class="secret-ratio stat">
          <div class="digit"></div>
          <div class="digit"></div>
          <div class="digit"></div>
        </div>
        <div class="treasure-ratio stat">
          <div class="digit"></div>
          <div class="digit"></div>
          <div class="digit"></div>
        </div>
        
        <div class="avg-kill-ratio victory-stat">
          <div class="digit"></div><div class="digit"></div><div class="digit"></div>
        </div>
        <div class="avg-secret-ratio victory-stat">
          <div class="digit"></div><div class="digit"></div><div class="digit"></div>
        </div>
        <div class="avg-treasure-ratio victory-stat">
          <div class="digit"></div><div class="digit"></div><div class="digit"></div>
        </div>
      </div>
      
      <div class="hud">
        <div class="floor number-container">
          <div class="number"></div>
        </div>
        <div class="score number-container">
          <div class="number"></div><div class="number"></div><div class="number"></div><div class="number"></div><div class="number"></div><div class="number"></div>
        </div>
        <div class="lives number-container">
          <div class="number"></div>
        </div>
        <div class="health number-container">
          <div class="number"></div><div class="number"></div><div class="number"></div>
        </div>
        <div class="ammo number-container">
          <div class="number"></div><div class="number"></div>
        </div>
        <div class="key1"></div>
        <div class="key2"></div>
        <div class="bj"></div>
        <div class="weapon"></div>
      </div>
    </div>
  </div>
</div>

<div id="touch-controls">
  <div class="top-cluster">
    <div class="touch-btn btn-menu" id="touch-btn-menu">MENU</div>
  </div>
  <div class="dpad-cluster">
    <div class="touch-btn dpad-btn dpad-up" data-key="UP">&#9650;</div>
    <div class="touch-btn dpad-btn dpad-down" data-key="DOWN">&#9660;</div>
    <div class="touch-btn dpad-btn dpad-left" data-key="LEFT">&#9664;</div>
    <div class="touch-btn dpad-btn dpad-right" data-key="RIGHT">&#9654;</div>
  </div>
  <div class="action-cluster">
    <div class="touch-btn btn-fire" data-key="CTRL">FIRE</div>
    <div class="touch-btn btn-use" data-key="SPACE">OPEN</div>
    <div class="touch-btn btn-strafe" data-key="ALT">STRAFE</div>
  </div>
</div>

<script>
  // Resize scaler to maintain 640x400 aspect ratio nicely inside iframe
  function fitMain() {
    const main = document.getElementById("main");
    if (!main) return;
    const vp = window.visualViewport;
    const w = vp ? vp.width : (window.innerWidth || document.documentElement.clientWidth);
    const h = vp ? vp.height : (window.innerHeight || document.documentElement.clientHeight);
    const scale = Math.min(w / 640, h / 400);
    main.style.transform = `scale(${scale})`;
  }
  window.addEventListener("resize", fitMain);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitMain);
  }
  fitMain();

  let lastActivityTime = 0;
  function notifyActivity() {
    const now = Date.now();
    if (now - lastActivityTime > 5000) {
      lastActivityTime = now;
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "game-activity" }, "*");
        }
      } catch (e) {}
    }
  }
  window.addEventListener("keydown", notifyActivity, true);
  window.addEventListener("pointerdown", notifyActivity, true);

  // Touch controls & Mobile audio unlock
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  const touchControls = document.getElementById("touch-controls");

  // Mobile Audio Unlock on first interaction
  function unlockAudio() {
    try {
      const dummy = new Audio();
      dummy.play().catch(function() {});
    } catch (_) {}
    window.removeEventListener("touchstart", unlockAudio, true);
    window.removeEventListener("pointerdown", unlockAudio, true);
  }
  window.addEventListener("touchstart", unlockAudio, true);
  window.addEventListener("pointerdown", unlockAudio, true);

  if (isTouchDevice) {
    // Poll game playing state to toggle virtual overlay during gameplay
    setInterval(function() {
      const isPlaying = window.Wolf && window.Wolf.Game && window.Wolf.Game.isPlaying();
      const isGameVisible = $("#game").is(":visible");
      if (isPlaying && isGameVisible) {
        if (touchControls.style.display !== "block") {
          touchControls.style.display = "block";
        }
      } else {
        if (touchControls.style.display !== "none") {
          touchControls.style.display = "none";
        }
      }
    }, 250);

    // Bind virtual buttons
    const activeTouches = {};

    function handleButtonState(btn, isDown) {
      if (!btn) return;
      const keyName = btn.getAttribute("data-key");
      if (isDown) {
        btn.classList.add("active");
        if (keyName && window.Wolf && window.Wolf.Input && window.Wolf.Input.setKey) {
          window.Wolf.Input.setKey(keyName, true);
        }
      } else {
        btn.classList.remove("active");
        if (keyName && window.Wolf && window.Wolf.Input && window.Wolf.Input.setKey) {
          window.Wolf.Input.setKey(keyName, false);
        }
      }
    }

    touchControls.addEventListener("touchstart", function(e) {
      notifyActivity();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const elem = document.elementFromPoint(touch.clientX, touch.clientY);
        const btn = elem ? elem.closest(".touch-btn") : null;
        if (btn) {
          if (btn.id === "touch-btn-menu") {
            if (window.Wolf && window.Wolf.Input && window.Wolf.Input.setKey) {
              window.Wolf.Input.setKey("ESC", true);
              setTimeout(function() {
                window.Wolf.Input.setKey("ESC", false);
              }, 100);
            }
          } else {
            activeTouches[touch.identifier] = btn;
            handleButtonState(btn, true);
          }
        }
      }
      e.preventDefault();
    }, { passive: false });

    touchControls.addEventListener("touchmove", function(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const prevBtn = activeTouches[touch.identifier];
        const elem = document.elementFromPoint(touch.clientX, touch.clientY);
        const currBtn = elem ? elem.closest(".touch-btn") : null;
        if (prevBtn !== currBtn) {
          if (prevBtn) handleButtonState(prevBtn, false);
          if (currBtn && currBtn.id !== "touch-btn-menu") {
            activeTouches[touch.identifier] = currBtn;
            handleButtonState(currBtn, true);
          } else {
            delete activeTouches[touch.identifier];
          }
        }
      }
      e.preventDefault();
    }, { passive: false });

    function clearTouch(touch) {
      const btn = activeTouches[touch.identifier];
      if (btn) {
        handleButtonState(btn, false);
        delete activeTouches[touch.identifier];
      }
    }

    touchControls.addEventListener("touchend", function(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        clearTouch(e.changedTouches[i]);
      }
      e.preventDefault();
    }, { passive: false });

    touchControls.addEventListener("touchcancel", function(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        clearTouch(e.changedTouches[i]);
      }
      e.preventDefault();
    }, { passive: false });
  }
</script>

</body>
</html>
